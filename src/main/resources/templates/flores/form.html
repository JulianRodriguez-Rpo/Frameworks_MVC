<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de flor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<div class="container">
    <h1 th:text="${flor.id} != null ? 'Editar flor' : 'Nueva flor'"></h1>

    <form class="form-card" th:action="@{/flores/guardar}" th:object="${flor}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="tipo">Tipo de flor</label>
        <input id="tipo" type="text" th:field="*{tipo}" required>

        <label for="color">Color</label>
        <input id="color" type="text" th:field="*{color}" required>

        <label for="variedad">Variedad</label>
        <input id="variedad" type="text" th:field="*{variedad}">

        <label for="cantidadDisponible">Cantidad disponible</label>
        <input id="cantidadDisponible" type="number" th:field="*{cantidadDisponible}" required>

        <label for="precioCompra">Precio de compra</label>
        <input id="precioCompra" type="number" step="0.01" th:field="*{precioCompra}" required>

        <label for="precioVenta">Precio de venta</label>
        <input id="precioVenta" type="number" step="0.01" th:field="*{precioVenta}" required>

        <div class="form-actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/flores}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
