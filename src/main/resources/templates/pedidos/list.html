<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de pedidos</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<div class="container">
    <h1>Gestión de pedidos</h1>
    <a class="btn" th:href="@{/pedidos/nuevo}">+ Nuevo pedido</a>

    <table>
        <thead>
        <tr>
            <th>Cliente</th>
            <th>Arreglo</th>
            <th>Ocasión</th>
            <th>Fecha entrega</th>
            <th>Presupuesto</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}">
            <td th:text="${pedido.cliente != null ? pedido.cliente.nombre : '-'}"></td>
            <td th:text="${pedido.tipoArreglo}"></td>
            <td th:text="${pedido.ocasion}"></td>
            <td th:text="${pedido.fechaEntrega}"></td>
            <td th:text="${pedido.presupuesto}"></td>
            <td th:text="${pedido.estado}"></td>
            <td class="actions">
                <a th:href="@{'/pedidos/editar/' + ${pedido.id}}">Editar</a>
                <a th:href="@{'/pedidos/eliminar/' + ${pedido.id}}"
                   onclick="return confirm('¿Eliminar este pedido?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
