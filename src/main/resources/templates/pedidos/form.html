<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de pedido</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<div class="container">
    <h1 th:text="${pedido.id} != null ? 'Editar pedido' : 'Nuevo pedido'"></h1>

    <form class="form-card" th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="cliente">Cliente</label>
        <select id="cliente" th:field="*{cliente}">
            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
        </select>

        <label for="tipoArreglo">Tipo de arreglo floral</label>
        <input id="tipoArreglo" type="text" th:field="*{tipoArreglo}" required>

        <label for="ocasion">Ocasión</label>
        <input id="ocasion" type="text" th:field="*{ocasion}">

        <label for="fechaEntrega">Fecha de entrega</label>
        <input id="fechaEntrega" type="date" th:field="*{fechaEntrega}" required>

        <label for="presupuesto">Presupuesto</label>
        <input id="presupuesto" type="number" step="0.01" th:field="*{presupuesto}" required>

        <label for="estado">Estado del pedido</label>
        <select id="estado" th:field="*{estado}">
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
        </select>

        <div class="form-actions">
            <button class="btn" type="submit">Guardar</button>
            <a class="btn btn-secondary" th:href="@{/pedidos}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
